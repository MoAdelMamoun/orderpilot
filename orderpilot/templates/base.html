<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OrderPilot{% endblock %} · OrderPilot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Order<span>Pilot</span> · <small class="muted">{{ shop_name }} · {{ shop_tagline }}</small></div>
    <nav>
      <a href="/" class="{% block nav_sim %}{% endblock %}">Chat simulator</a>
      <a href="/admin" class="{% block nav_admin %}{% endblock %}">Admin</a>
      <a href="/admin/conversations" class="{% block nav_convs %}{% endblock %}">Conversations</a>
    </nav>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">
    OrderPilot — a showcase project by
    <a href="https://mohamedadelmamoun.com">Mohamed Adel Mamoun</a>.
    Proves the “Bots &amp; Integrations” service area. All data is fictional.
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
